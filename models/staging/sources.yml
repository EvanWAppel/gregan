version: 2

sources:
  - name: raw
    database: glendora
    schema: raw
    tables:
      - name: restaurant_inspections
        description: >
          LA County Environmental Health restaurant & market inspections (ArcGIS Hub
          item 19b6607ac82c4512b10811870975dbdc, a static cp1252 CSV export),
          filtered at load to FACILITY CITY = 'GLENDORA' (101,244 → 507 rows). ONE
          ROW PER INSPECTION ACTIVITY — a facility can have several programs/visits.
          Columns (all text from the CSV load): "ACTIVITY DATE" (MM/DD/YYYY, leading
          space), OWNER/FACILITY ids + names, PROGRAM NAME/STATUS/ELEMENT, "PE
          DESCRIPTION" (risk tier), FACILITY ADDRESS/CITY/STATE/ZIP, SERVICE
          CODE/DESCRIPTION, SCORE (0-100), GRADE (A/B/C), SERIAL NUMBER, EMPLOYEE ID.
          Non-spatial — address/zip only, no lat/lon (a map would need geocoding).
        loaded_at_field: "try_strptime(trim(\"ACTIVITY DATE\"), '%m/%d/%Y')"
        freshness:
          warn_after: {count: 60, period: day}
          error_after: {count: 180, period: day}
      - name: fire_perimeters
        description: >
          CAL FIRE California Historic Fire Perimeters intersecting the Glendora
          bounding box (envelope query, WGS84). Includes the 2014 Colby Fire.
          One row per perimeter; GIS_ACRES is the polygon area (overlaps
          double-count if summed). rings_json is the outer ring for the map.
      - name: fire_stations
        description: >
          Glendora city GIS Fire_Stations FeatureServer/0 — three LA County Fire
          stations as WGS84 points.
      - name: fire_hazard_zones
        description: >
          CAL FIRE Fire Hazard Severity Zones intersecting the Glendora bbox.
          SRA layer 0 (2007 vintage) + LRA layer 1 (2011 vintage). Not the 2025
          FHSZ update — caption the vintage on the page.
      - name: weather
        description: NOAA GHCN-Daily CSV for San Gabriel Dam USC00047779.
      - name: river
        description: USGS NWIS daily discharge (00060) and gage height (00065) at 11085000.
      - name: gw_stations
        description: CA DWR stations in Bulletin-118 basin San Gabriel Valley (80 wells).
      - name: gw_measurements
        description: CA DWR periodic groundwater levels for basin_code 4-013.
      - name: air_quality
        description: EPA AQS daily Ozone (Glendora 0016) and PM2.5 (Pasadena 2005).
      - name: ntd_ridership
        description: FTA NTD monthly UPT for Foothill Transit and LA Metro since 2015.
      - name: parks
        description: Glendora GIS Parks layer 1 — 15 polygons with acreage.
      - name: trees
        description: Glendora GIS street-tree inventory (~14k points).
      - name: zoning
        description: Glendora GIS Zoning_Glendora layer 26 polygons.
      - name: earthquakes
        description: USGS FDSN earthquakes in the Glendora bbox since 2000.
      - name: crime
        description: CA DOJ Crimes & Clearances annual rows for NCICCode=Glendora.
      - name: demographics
        description: Census ACS 5-year place estimates for Glendora city (place 30014).
