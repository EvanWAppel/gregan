version: 2

models:
  - name: mart_inspections_by_grade
    description: Grade distribution (A/B/C) across Glendora inspection activities.
    columns:
      - name: grade
        data_tests:
          - not_null
          - unique
  - name: mart_inspections_facilities
    description: One row per Glendora facility — its most recent inspection.
    columns:
      - name: facility_id
        description: LA County facility id — the natural key (one row per facility here).
        data_tests:
          - not_null
          - unique
  - name: mart_fire_perimeters
    description: Historic fire perimeters intersecting Glendora (map + table).
    columns:
      - name: objectid
        data_tests:
          - not_null
          - unique
  - name: mart_fire_by_decade
    description: Fire count and GIS acres by decade.
    columns:
      - name: decade
        data_tests:
          - not_null
          - unique
  - name: mart_fire_stations
    description: Glendora fire stations as map points.
    columns:
      - name: name
        data_tests:
          - not_null
          - unique
  - name: mart_fire_hazard_zones
    description: FHSZ polygons intersecting Glendora (SRA 2007 + LRA 2011).
    columns:
      - name: objectid
        data_tests:
          - not_null
  - name: mart_weather_annual
    columns:
      - name: year
        data_tests: [not_null, unique]
  - name: mart_river_daily
    columns:
      - name: obs_date
        data_tests: [not_null]
  - name: mart_gw_stations
    columns:
      - name: site_code
        data_tests: [not_null, unique]
  - name: mart_transit_monthly
    columns:
      - name: ridership_month
        data_tests: [not_null, unique]
  - name: mart_parks
    columns:
      - name: acres
        data_tests: [not_null]
  - name: mart_trees_summary
    columns:
      - name: total_trees
        data_tests: [not_null]
  - name: mart_earthquakes
    columns:
      - name: event_id
        data_tests: [not_null, unique]
  - name: mart_crime_annual
    columns:
      - name: year
        data_tests: [not_null, unique]
  - name: mart_demographics
    columns:
      - name: geoid
        data_tests: [not_null, unique]
      - name: population
        data_tests: [not_null]
